name: KIN CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: kin-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify ${{ matrix.app.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app:
          - name: Active application
            working-directory: .
          - name: Legacy Radar prototype
            working-directory: demo/lovable-mvp

    defaults:
      run:
        working-directory: ${{ matrix.app.working-directory }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

      - name: Run strict lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Check formatting
        run: bunx prettier --check .
